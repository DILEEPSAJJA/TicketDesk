version: '3.8'

services:
  # ==========================================
  # Spring Boot 3 Java 17 Backend Service
  # ==========================================
  ticketdesk-backend:
    build:
      context: ./ticketdesk-backend
      dockerfile: Dockerfile
    container_name: ticketdesk-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ticketdesk-network

  # ==========================================
  # React 19 Nginx Frontend Web Service
  # ==========================================
  ticketdesk-frontend:
    build:
      context: ./ticketdesk-frontend
      dockerfile: Dockerfile
    container_name: ticketdesk-frontend
    ports:
      - "3000:80"
    depends_on:
      ticketdesk-backend:
        condition: service_healthy
    networks:
      - ticketdesk-network

networks:
  ticketdesk-network:
    driver: bridge
