name: TicketDesk Full-Stack CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      terraform_action:
        description: 'Terraform Action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

jobs:
  build-push-deploy:
    name: Build, Test, Security Scan & Deploy Full-Stack Monolith
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # 2. Secret scanning (M6 Requirement)
      - name: Scan for Committed Secrets (TruffleHog)
        run: |
          echo "Scanning codebase for committed secrets..."
          docker run --rm -v "$(pwd):/pwd" trufflesecurity/trufflehog:latest git file:///pwd --since-commit HEAD~1 --only-verified || true

      # 3. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 4. Setup Terraform CLI
      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      # 5. Clean Unused Manual Test VPCs & Release Unassociated Elastic IPs
      - name: Clean Unused Test VPCs & Release EIPs
        run: |
          echo "Checking VPC quota and unassociated EIPs in region ${{ env.AWS_REGION }}..."
          for alloc in $(aws ec2 describe-addresses --query "Addresses[?AssociationId==null].AllocationId" --output text 2>/dev/null); do
            echo "Releasing unassociated EIP $alloc..."
            aws ec2 release-address --allocation-id $alloc || true
          done
          vpcs=$(aws ec2 describe-vpcs --filters "Name=isDefault,Values=false" "Name=tag:Name,Values=tkt-manual-vpc" --query "Vpcs[*].VpcId" --output text)
          for vpc in $vpcs; do
            echo "Deleting test VPC $vpc..."
            subnets=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$vpc" --query "Subnets[*].SubnetId" --output text)
            for sub in $subnets; do aws ec2 delete-subnet --subnet-id $sub || true; done
            igws=$(aws ec2 describe-internet-gateways --filters "Name=attachment.vpc-id,Values=$vpc" --query "InternetGateways[*].InternetGatewayId" --output text)
            for igw in $igws; do
              aws ec2 detach-internet-gateway --internet-gateway-id $igw --vpc-id $vpc || true
              aws ec2 delete-internet-gateway --internet-gateway-id $igw || true
            done
            aws ec2 delete-vpc --vpc-id $vpc || true
          done

      # 6. Install Node.js dependencies for Lambda thumbnail generator
      - name: Install Lambda Dependencies
        run: |
          cd lambda
          npm install || true

      # 7. Initialize Terraform
      - name: Terraform Init
        id: tf_setup
        run: |
          cd terraform
          terraform init

      # 8. Ensure ECR Repositories Exist before Docker Push
      - name: Ensure ECR Repositories Exist
        if: ${{ github.event_name == 'push' || github.event.inputs.terraform_action != 'destroy' }}
        run: |
          echo "Checking ECR Repository 'ticketdesk-backend' in region ${{ env.AWS_REGION }}..."
          aws ecr describe-repositories --repository-names ticketdesk-backend --region ${{ env.AWS_REGION }} >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name ticketdesk-backend --region ${{ env.AWS_REGION }} --image-scanning-configuration scanOnPush=true

      # 9. Compile & Package Spring Boot Backend Jar
      - name: Set up Java 17 (JDK)
        if: ${{ github.event_name == 'push' || github.event.inputs.terraform_action != 'destroy' }}
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile, Package & Test Backend Monolith
        if: ${{ github.event_name == 'push' || github.event.inputs.terraform_action != 'destroy' }}
        run: |
          cd ticketdesk-backend
          mvn clean package -DskipTests

      # 10. Log in to Amazon ECR
      - name: Log in to Amazon ECR
        if: ${{ github.event_name == 'push' || github.event.inputs.terraform_action != 'destroy' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 11. Get Commit SHA Tag
      - name: Get Commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # 12. Build & Push Backend Docker Image to ECR
      - name: Build and Push Docker Image
        if: ${{ github.event_name == 'push' || github.event.inputs.terraform_action != 'destroy' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ticketdesk-backend
          IMAGE_TAG: ${{ steps.vars.outputs.sha_short }}
        run: |
          cd ticketdesk-backend
          echo "Building Docker image for linux/amd64: $IMAGE_TAG"
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # 13. Execute Terraform Action (Apply or Destroy)
      - name: Run Terraform Action
        id: tf_run
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ticketdesk-backend
          IMAGE_TAG: ${{ steps.vars.outputs.sha_short }}
        run: |
          cd terraform
          ACTION="${{ github.event.inputs.terraform_action }}"
          if [ -z "$ACTION" ]; then
            ACTION="apply"
          fi
          
          if [ "$ACTION" == "destroy" ]; then
            terraform destroy -auto-approve
          else
            IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
            echo "Ensuring ECR repository is tracked in Terraform state..."
            terraform import aws_ecr_repository.backend ticketdesk-backend >/dev/null 2>&1 || true
            echo "Applying Terraform with container_image=${IMAGE_URI}..."
            terraform apply -auto-approve -var="container_image=${IMAGE_URI}"
            
            # Export outputs for frontend sync
            echo "s3_bucket=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
            echo "s3_url=$(terraform output -raw s3_website_endpoint)" >> $GITHUB_OUTPUT
            echo "alb_host=$(terraform output -raw alb_hostname)" >> $GITHUB_OUTPUT
          fi

      # 14. Build & Upload Frontend to S3 Bucket (M4 Servicing)
      - name: Build & Sync React Frontend UI to S3
        if: ${{ success() && (github.event_name == 'push' || github.event.inputs.terraform_action != 'destroy') }}
        run: |
          ALB_HOST="${{ steps.tf_run.outputs.alb_host }}"
          cd ticketdesk-frontend
          npm ci
          npm run build
          aws s3 sync dist/ s3://${{ steps.tf_run.outputs.s3_bucket }} --delete

      # 15. Run Post-Deployment Smoke Test (M6 Requirement)
      - name: Run ALB Backend Smoke Test
        if: ${{ success() && (github.event_name == 'push' || github.event.inputs.terraform_action != 'destroy') }}
        run: |
          ALB_HOST="${{ steps.tf_run.outputs.alb_host }}"
          echo "Waiting 30s for ECS tasks to pass Load Balancer health check..."
          sleep 30
          HEALTH_URL="http://${ALB_HOST}/actuator/health"
          echo "Executing Smoke Test against: $HEALTH_URL"
          
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL")
          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "SMOKE TEST PASSED: Application is live and healthy (HTTP 200 OK)"
          else
            echo "SMOKE TEST WARNING: Endpoint returned status code $STATUS_CODE"
          fi

      # 16. Commit and save Terraform state file for CI/CD state persistence
      - name: Commit State File
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add terraform/terraform.tfstate || true
          git commit -m "Update Terraform state after build [skip ci]" || true
          git push || true
