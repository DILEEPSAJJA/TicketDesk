# Server Port
server.port=8080

# H2 Database Configuration (Environment-variable overridable with H2 default)
spring.datasource.url=${DB_URL:jdbc:h2:mem:ticketdesk_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Enable H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Disable automatic SQL script initialization (Hibernate ddl-auto handles schema creation)
spring.sql.init.mode=never

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (AWS Secrets Manager / Parameter Store Compatible)
jwt.secret=${JWT_SECRET:9a4f2c8d7e1b5a3f6c9d2e4f8a1b5c7d9e2f4a6b8c0d3e5f7a9b1c4d6e8f0a2b}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Spring Boot Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.root=INFO
logging.level.com.ticketdesk=DEBUG
logging.level.org.springframework.security=INFO
